<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <script>
        // 無障礙：清掉網址列殘留的錨點 hash，避免重新整理時瀏覽器原生錨點跳轉
        if (window.location.hash) {
            history.replaceState(null, '', window.location.pathname + window.location.search);
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/logo/edu_logo.png" type="image/png">
    <title>密碼變更 | 115學年度新北區數理暨資訊學科能力競賽複賽報名系統</title>
    <meta name="description" content="115學年度新北區數理暨資訊學科能力競賽複賽報名系統密碼變更，首次登入請先變更密碼以保障帳號安全。">

    <link rel="stylesheet" href="css/all.css">
</head>
<body>
    <!-- 無障礙：跳過導覽列，進入主要內容區 -->
    <a href="#goCenter" class="sr-only focusable" accesskey="C" title="跳過導覽列，進入主要內容區">主要內容區</a>
    <!-- 無障礙：跳至上方導覽列（僅供 Alt+U 快速鍵定位）-->
    <a href="#headerNav" class="sr-only focusable" accesskey="U" title="跳至上方導覽列" tabindex="-1">上方導覽列</a>

    <div id="header" data-layout="layout/header_School.html"></div>

    <main id="goCenter" tabindex="-1">
        <!-- 內頁橫幅：平面幾何科學風插畫背景（裝飾性，CSS background） -->
        <div class="pageBanner wizardPageHeader pageBanner--overlap">
            <h1>密碼變更</h1>
        </div>

        <section class="authSection contentOverlap">
            <div class="container">

                <!-- 後端：action 與驗證邏輯由後端接手 -->
                <form class="authCard" id="passwordChangeForm" action="/passwordChange" method="POST" novalidate>
                    <!-- 後端：僅首次登入時顯示此提醒 -->
                    <p class="authNotice">
                        <i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i>
                        第一次登入，請變更密碼！
                    </p>

                    <div class="formField">
                        <label class="formField-label" for="oldPassword">舊密碼
                            <span class="requiredPill">必填</span>
                        </label>
                        <div class="inputText-wrap">
                            <input class="inputText" type="password" id="oldPassword" name="oldPassword" autocomplete="current-password" placeholder="請輸入舊密碼" required>
                            <button type="button" class="inputPasswordToggle" data-target="oldPassword" aria-label="顯示密碼">
                                <i class="bi bi-eye-slash" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>

                    <div class="formField">
                        <label class="formField-label" for="newPassword">新密碼
                            <span class="requiredPill">必填</span>
                        </label>
                        <div class="inputText-wrap">
                            <input class="inputText" type="password" id="newPassword" name="newPassword" autocomplete="new-password" placeholder="請輸入新密碼(需區分大小寫)" aria-describedby="newPasswordHint" required>
                            <button type="button" class="inputPasswordToggle" data-target="newPassword" aria-label="顯示密碼">
                                <i class="bi bi-eye-slash" aria-hidden="true"></i>
                            </button>
                        </div>
                        <span class="formField-help" id="newPasswordHint">密碼需 8 碼以上，含大小寫英文字母與數字。</span>
                    </div>

                    <div class="formField">
                        <label class="formField-label" for="newPasswordConfirm">新密碼確認
                            <span class="requiredPill">必填</span>
                        </label>
                        <div class="inputText-wrap">
                            <input class="inputText" type="password" id="newPasswordConfirm" name="newPasswordConfirm" autocomplete="new-password" placeholder="請再次輸入新密碼(需區分大小寫)" required>
                            <button type="button" class="inputPasswordToggle" data-target="newPasswordConfirm" aria-label="顯示密碼">
                                <i class="bi bi-eye-slash" aria-hidden="true"></i>
                            </button>
                        </div>
                        <!-- 錯誤提示範例：兩次輸入不一致時由後端／JS 顯示，具體單行文字說明 -->
                        <p class="formField-error" hidden id="newPasswordConfirmError">
                            <i class="bi bi-x-circle-fill" aria-hidden="true"></i>兩次輸入的新密碼不一致，請重新確認
                        </p>
                    </div>

                    <button type="submit" class="btnRounded btn-indigo w-100">立即登入
                        <i class="bi bi-arrow-right" aria-hidden="true"></i>
                    </button>
                </form>
            </div>
        </section>
    </main>

    <!-- 回到頂部 -->
    <button type="button" class="scroll-top-btn" aria-label="回到頁面頂端">
        <i class="bi bi-arrow-up" aria-hidden="true"></i>
        <span class="scroll-top-text">置頂</span>
    </button>

    <div id="footer" data-layout="layout/footer.html"></div>

    <!-- 全站腳本（本地端，禁止 CDN）：順序不可調換 -->
    <script src="js/vendor/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
